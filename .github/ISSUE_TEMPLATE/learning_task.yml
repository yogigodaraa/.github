name: Learning task
description: A small, well-scoped task for learning the codebase (tests, docs, refactors)
labels: [good first issue, learning]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where to look
      description: Files, functions or docs to start from.
  - type: textarea
    id: learn
    attributes:
      label: What you'll learn
      description: The concept or skill this task exercises.
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] Tests added and passing in CI
        - [ ] Docs updated
