name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. Click `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, tokens and personal data before pasting.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, browser, Node/Python version, commit SHA"
